<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Giga:wght@100..900&display=swap" rel="stylesheet">
  <title>Document</title>
</head>
<body>
  <div class="input-block">
    <form class="input-form">
      <p class="label-input">Введите имя Игрока 1</p>
      <input class="input-name" placeholder="Name">
      <button class="add-name" type="submit">Enter</button>
    </form>
  </div>
  <div class="gamezone">
    <div class="tablezone">
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
    </div>

    <div class="checkzone">
      <h1>СЧЕТ</h1>
      <div class="players">
        <div class="player1 curret-player"></div>
        <div class="player2"></div>
      </div>
      <div class="check">
        <div class="point point1 ">0</div>
        <div class="point point2">0</div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
